name: NightWolf Forge 1.21.11 config crash fix v2.1.1

on:
  push:
    branches:
      - chatgpt-forge12111-configfix-v211

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4

      - name: Restore patched source
        shell: bash
        run: |
          base64 -d .chatgpt-forge12111-configfix/source.b64 > /tmp/NightWolf-Forge12111-FixedMods-v2.1.1.tar.gz
          echo "db75ec8348e0d5aac39c9f9298ffea1459b3d2fadbee03c6144e34bdd39ef997  /tmp/NightWolf-Forge12111-FixedMods-v2.1.1.tar.gz" | sha256sum -c -
          tar -xzf /tmp/NightWolf-Forge12111-FixedMods-v2.1.1.tar.gz -C /tmp

      - name: Set up Java 21
        uses: actions/setup-java@v5
        with:
          distribution: corretto
          java-version: '21'

      - name: Set up Gradle 9.5.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.5.1'

      - name: Verify blur fix in source
        shell: bash
        run: |
          set -euo pipefail
          ROOT=/tmp/NightWolf-Forge12111-FixedMods
          grep -n "public void renderBackground" "$ROOT/autofish/src/main/java/de/nightwolf/autofish/AutoFishConfigScreen.java"
          grep -n "public void renderBackground" "$ROOT/secondchat/src/main/java/de/magicwolf/secondchat/SecondChatConfigScreen.java"
          ! grep -q "this.renderBackground" "$ROOT/autofish/src/main/java/de/nightwolf/autofish/AutoFishConfigScreen.java"
          ! grep -q "this.renderBackground" "$ROOT/secondchat/src/main/java/de/magicwolf/secondchat/SecondChatConfigScreen.java"
          grep -q "mod_version=2.1.1" "$ROOT/gradle.properties"

      - name: Build AutoFish and SecondChat
        shell: bash
        working-directory: /tmp/NightWolf-Forge12111-FixedMods
        run: |
          set -o pipefail
          for attempt in 1 2 3; do
            echo "=== ForgeGradle attempt $attempt/3 ==="
            if gradle :autofish:clean :autofish:build :secondchat:clean :secondchat:build --no-daemon --stacktrace; then
              exit 0
            fi
            test "$attempt" -lt 3 || exit 1
            sleep 20
          done

      - name: Collect and verify v2.1.1 jars
        shell: bash
        working-directory: /tmp/NightWolf-Forge12111-FixedMods
        run: |
          set -euo pipefail
          mkdir -p /tmp/release
          AF=$(find autofish/build/libs -maxdepth 1 -type f -name '*.jar' ! -name '*sources*' | head -n 1)
          SC=$(find secondchat/build/libs -maxdepth 1 -type f -name '*.jar' ! -name '*sources*' | head -n 1)

          cp "$AF" /tmp/release/NightWolf-AutoFish-LabyMod4-Forge-1.21.11-v2.1.1-CONFIG-CRASH-FIX.jar
          cp "$SC" /tmp/release/MagicWolf-GG-SecondChat-LabyMod4-Forge-1.21.11-v2.1.1-CONFIG-CRASH-FIX.jar

          for jar in /tmp/release/*.jar; do
            echo "==== $jar ===="
            unzip -t "$jar" | tail -n 2
            unzip -p "$jar" META-INF/mods.toml | grep -E 'modId=|version=|1.21.11'
            unzip -p "$jar" pack.mcmeta
            jar tf "$jar" | grep -E 'ConfigScreen.class|Mod.class|META-INF/mods.toml|pack.mcmeta'
            sha256sum "$jar"
          done

      - name: Upload fixed Forge mods
        uses: actions/upload-artifact@v4
        with:
          name: NightWolf-LabyMod4-Forge-1.21.11-v2.1.1-CONFIG-CRASH-FIX
          path: /tmp/release/*.jar
          if-no-files-found: error
