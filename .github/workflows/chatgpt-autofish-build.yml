name: NightWolf AutoFish temporary build

on:
  push:
    branches:
      - chatgpt-autofish-build

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - name: Reconstruct source archive
        shell: bash
        run: |
          cat .chatgpt-autofish/autofish.part1               .chatgpt-autofish/autofish.part2               .chatgpt-autofish/autofish.part3               .chatgpt-autofish/autofish.part4a               .chatgpt-autofish/autofish.part4b               .chatgpt-autofish/autofish.part5 > /tmp/autofish.b64
          base64 -d /tmp/autofish.b64 > /tmp/autofish-ci.tar.gz
          echo "2a17d6f48f078ee965e35d533f2d91bf6bc4fddfd5004c05751bf5fd1376c8b4  /tmp/autofish-ci.tar.gz" | sha256sum -c -
          tar -xzf /tmp/autofish-ci.tar.gz -C /tmp

      - name: Apply LabyMod mixin bridge fix
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          root=Path('/tmp/NightWolfAutoFish-LabyMod4-1.21x')
          bridge=root/'core/src/main/java/gg/nightwolf/autofish/core/bridge/FishingHookBridge.java'
          bridge.parent.mkdir(parents=True, exist_ok=True)
          bridge.write_text("""package gg.nightwolf.autofish.core.bridge;

          public interface FishingHookBridge {
            boolean nightwolf$isBiting();
          }
          """)
          for vdir in (root/'game-runner/src').glob('v1_21*'):
              pkg=vdir.name
              mix=vdir/'java'/f'gg/nightwolf/autofish/{pkg}/mixins/FishingHookAccessor.java'
              mix.write_text(f"""package gg.nightwolf.autofish.{pkg}.mixins;

          import gg.nightwolf.autofish.core.bridge.FishingHookBridge;
          import net.minecraft.world.entity.projectile.FishingHook;
          import org.spongepowered.asm.mixin.Mixin;
          import org.spongepowered.asm.mixin.Shadow;

          @Mixin(FishingHook.class)
          public abstract class FishingHookAccessor implements FishingHookBridge {{

            @Shadow
            private boolean biting;

            @Override
            public boolean nightwolf$isBiting() {{
              return this.biting;
            }}
          }}
          """)
              pf=vdir/'java'/f'gg/nightwolf/autofish/{pkg}/mixins/PlayerFishingAccessor.java'
              if pf.exists():
                  pf.unlink()
              rt=vdir/'java'/f'gg/nightwolf/autofish/{pkg}/autofish/AutoFishRuntime.java'
              s=rt.read_text()
              s=s.replace(f'import gg.nightwolf.autofish.{pkg}.mixins.FishingHookAccessor;\n','')
              s=s.replace(f'import gg.nightwolf.autofish.{pkg}.mixins.PlayerFishingAccessor;\n','')
              if 'import gg.nightwolf.autofish.core.bridge.FishingHookBridge;' not in s:
                  s=s.replace('import gg.nightwolf.autofish.core.NightWolfAutoFishConfiguration;\n',
                              'import gg.nightwolf.autofish.core.NightWolfAutoFishConfiguration;\nimport gg.nightwolf.autofish.core.bridge.FishingHookBridge;\n')
              s=s.replace('FishingHook hook = ((PlayerFishingAccessor) (Object) player).nightwolf$getFishingHook();',
                          'FishingHook hook = player.fishing;')
              s=s.replace('hook = ((PlayerFishingAccessor) (Object) player).nightwolf$getFishingHook();',
                          'hook = player.fishing;')
              s=s.replace('boolean synchronizedBite = ((FishingHookAccessor) (Object) hook).nightwolf$isBiting();',
                          'boolean synchronizedBite = ((FishingHookBridge) (Object) hook).nightwolf$isBiting();')
              rt.write_text(s)
          PY

      - name: Set up JDK 25
        uses: actions/setup-java@v5
        with:
          distribution: corretto
          java-version: '25'

      - name: Set up Gradle 9.7.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.7.1'
          cache-read-only: false

      - name: Build all configured 1.21.x versions
        working-directory: /tmp/NightWolfAutoFish-LabyMod4-1.21x
        shell: bash
        run: |
          set -o pipefail
          for attempt in 1 2 3 4; do
            echo "=== Gradle build attempt $attempt/4 ==="
            if gradle build --full-stacktrace --no-daemon; then
              exit 0
            fi
            if [ "$attempt" -eq 4 ]; then
              exit 1
            fi
            echo "Build attempt failed; retrying dependency resolution in 25 seconds..."
            sleep 25
          done

      - name: Create LabyMod production release jar
        working-directory: /tmp/NightWolfAutoFish-LabyMod4-1.21x
        shell: bash
        run: |
          set -o pipefail
          for attempt in 1 2 3; do
            echo "=== createReleaseJar attempt $attempt/3 ==="
            if gradle createReleaseJar --full-stacktrace --no-daemon; then
              exit 0
            fi
            if [ "$attempt" -eq 3 ]; then
              exit 1
            fi
            sleep 20
          done

      - name: Show artifacts
        working-directory: /tmp/NightWolfAutoFish-LabyMod4-1.21x
        run: find build/libs -maxdepth 1 -type f -printf '%f %s bytes\n' | sort

      - name: Upload release jar
        uses: actions/upload-artifact@v4
        with:
          name: NightWolfAutoFish-LabyMod4-1.21x-Recoded-by-NightWolfLG-NightWolfGG
          path: /tmp/NightWolfAutoFish-LabyMod4-1.21x/build/libs/*-release.jar
          if-no-files-found: error
