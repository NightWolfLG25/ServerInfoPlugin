name: MagicWolf GG Second Chat - Forge 1.21.x matrix

on:
  push:
    branches:
      - chatgpt-secondchat-1-21x-build

permissions:
  contents: read

env:
  MOD_VERSION: 2.0.1

jobs:
  build:
    name: Forge ${{ matrix.mc }} (${{ matrix.forge }})
    runs-on: ubuntu-latest
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        include:
          - mc: '1.21'
            forge: '51.0.33'
          - mc: '1.21.1'
            forge: '52.1.16'
          - mc: '1.21.3'
            forge: '53.1.12'
          - mc: '1.21.4'
            forge: '54.1.18'
          - mc: '1.21.5'
            forge: '55.1.13'
          - mc: '1.21.6'
            forge: '56.0.9'
          - mc: '1.21.7'
            forge: '57.0.3'
          - mc: '1.21.8'
            forge: '58.1.22'
          - mc: '1.21.9'
            forge: '59.0.5'
          - mc: '1.21.10'
            forge: '60.1.15'
          - mc: '1.21.11'
            forge: '61.2.1'

    steps:
      - uses: actions/checkout@v4

      - name: Prepare source tree
        shell: bash
        run: |
          set -euo pipefail
          test -f .chatgpt-secondchat/source/java/de/magicwolf/ggchat/MagicWolfGGChatOverlay.java
          test -f .chatgpt-secondchat/source/resources/META-INF/mods.toml

      - name: Set up Java 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Download Forge MDK
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/mdk
          url="https://maven.minecraftforge.net/net/minecraftforge/forge/${{ matrix.mc }}-${{ matrix.forge }}/forge-${{ matrix.mc }}-${{ matrix.forge }}-mdk.zip"
          echo "Downloading $url"
          curl -fL --retry 5 --retry-all-errors --connect-timeout 20 "$url" -o /tmp/forge-mdk.zip
          unzip -q /tmp/forge-mdk.zip -d /tmp/mdk

      - name: Install SecondChat source into MDK
        shell: bash
        run: |
          set -euo pipefail
          rm -rf /tmp/mdk/src/main
          mkdir -p /tmp/mdk/src
          mkdir -p /tmp/mdk/src/main
          cp -a .chatgpt-secondchat/source/java /tmp/mdk/src/main/
          cp -a .chatgpt-secondchat/source/resources /tmp/mdk/src/main/
          python3 - <<'PY'
          from pathlib import Path
          import re
          root=Path('/tmp/mdk')
          mc='${{ matrix.mc }}'
          forge='${{ matrix.forge }}'
          major=forge.split('.')[0]
          version='2.0.1-forge-'+mc

          toml=root/'src/main/resources/META-INF/mods.toml'
          s=toml.read_text(encoding='utf-8')
          s=s.replace('__LOADER_MAJOR__', major).replace('__MC_VERSION__', mc).replace('__FORGE_VERSION__', major)
          toml.write_text(s, encoding='utf-8')

          props=root/'gradle.properties'
          text=props.read_text(encoding='utf-8') if props.exists() else ''
          values={
            'minecraft_version': mc,
            'minecraft_version_range': '['+mc+']',
            'forge_version': forge,
            'forge_version_range': '['+major+',)',
            'loader_version_range': '['+major+',)',
            'mapping_channel': 'official',
            'mapping_version': mc,
            'mod_id': 'magicwolf_gg_chat_overlay',
            'mod_name': 'MagicWolf GG Second Chat',
            'mod_license': 'All Rights Reserved',
            'mod_version': version,
            'mod_group_id': 'de.magicwolf.ggchat',
            'mod_authors': 'NightWolfLG',
            'mod_description': 'Zweites anpassbares Chatfenster fuer MSG, Plot/PChat und Geldbewegungen - coded by NightWolfLG'
          }
          for key,val in values.items():
            pattern=re.compile(r'(?m)^'+re.escape(key)+r'=.*$')
            if pattern.search(text):
              text=pattern.sub(key+'='+val, text)
            else:
              if text and not text.endswith('\n'): text+='\n'
              text+=key+'='+val+'\n'
          props.write_text(text, encoding='utf-8')
          PY

      - name: Build Forge JAR
        working-directory: /tmp/mdk
        shell: bash
        run: |
          set -euo pipefail
          chmod +x gradlew
          for attempt in 1 2 3; do
            echo "=== Forge ${{ matrix.mc }} build attempt $attempt/3 ==="
            if ./gradlew build --no-daemon --stacktrace; then
              break
            fi
            if [ "$attempt" = 3 ]; then exit 1; fi
            sleep 20
          done
          mkdir -p /tmp/out
          jarfile=$(find build/libs -maxdepth 1 -type f -name '*.jar' ! -name '*sources*' ! -name '*javadoc*' | head -n 1)
          test -n "$jarfile"
          cp "$jarfile" "/tmp/out/MagicWolf-GG-SecondChat-Forge-${{ matrix.mc }}-v2.0.1.jar"
          unzip -t "/tmp/out/MagicWolf-GG-SecondChat-Forge-${{ matrix.mc }}-v2.0.1.jar" >/dev/null
          sha256sum "/tmp/out/MagicWolf-GG-SecondChat-Forge-${{ matrix.mc }}-v2.0.1.jar" > "/tmp/out/MagicWolf-GG-SecondChat-Forge-${{ matrix.mc }}-v2.0.1.jar.sha256"
          echo "Built:"
          ls -lh /tmp/out/

      - name: Upload version JAR
        uses: actions/upload-artifact@v4
        with:
          name: MagicWolf-GG-SecondChat-Forge-${{ matrix.mc }}-v2.0.1
          path: /tmp/out/*
          if-no-files-found: error
          retention-days: 30

  package:
    name: Package all Forge 1.21.x JARs
    needs: build
    if: ${{ always() && needs.build.result == 'success' }}
    runs-on: ubuntu-latest
    steps:
      - name: Download all version artifacts
        uses: actions/download-artifact@v5
        with:
          pattern: MagicWolf-GG-SecondChat-Forge-*-v2.0.1
          path: /tmp/all
          merge-multiple: true

      - name: Verify and package
        shell: bash
        run: |
          set -euo pipefail
          count=$(find /tmp/all -maxdepth 1 -type f -name '*.jar' | wc -l)
          echo "JAR count: $count"
          test "$count" -eq 11
          for f in /tmp/all/*.jar; do unzip -t "$f" >/dev/null; done
          (cd /tmp/all && sha256sum *.jar > SHA256SUMS.txt)
          mkdir -p /tmp/package
          cp /tmp/all/* /tmp/package/
          (cd /tmp/package && zip -9 -r /tmp/MagicWolf-GG-SecondChat-Forge-ALL-1.21.x-v2.0.1.zip .)

      - name: Upload complete package
        uses: actions/upload-artifact@v4
        with:
          name: MagicWolf-GG-SecondChat-Forge-ALL-1.21.x-v2.0.1
          path: /tmp/MagicWolf-GG-SecondChat-Forge-ALL-1.21.x-v2.0.1.zip
          if-no-files-found: error
          retention-days: 30
